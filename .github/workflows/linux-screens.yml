name: Linux screenshots

# Pictures of KherveSlide on a real Linux desktop (Xvfb + the Xfce window
# manager), for the website. Trigger: git tag screens-<n> && git push origin screens-<n>

on:
  push:
    tags:
      - "screens-*"

jobs:
  shots:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Desktop, Qt runtime and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xfwm4 xfce4-settings \
            imagemagick fonts-dejavu-core fonts-ubuntu dbus-x11 \
            libgl1 libegl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libnss3
      - name: Python dependencies and tectonic
        run: |
          pip install -r requirements.txt
          python packaging/fetch_tectonic.py
          echo "$PWD/build/tectonic" >> "$GITHUB_PATH"
      - name: Take the screenshots
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1940x950x24 &
          sleep 2
          xsetroot -solid "#3b4252" || true
          xfwm4 --compositor=off &
          sleep 3
          mkdir -p shots
          python packaging/linux_screens.py shots "Materials science talk:3" "Diagrams & workflows:1" "Research talk:3"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-screenshots
          path: shots/*.png
