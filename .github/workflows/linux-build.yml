name: Linux build

# Debian packages: amd64 (Debian, Ubuntu, Mint...) and arm64 (64-bit
# Raspberry Pi OS, Debian / Ubuntu on ARM). PyInstaller cannot
# cross-compile, so arm64 is built on GitHub's ARM runner. Ubuntu 22.04
# (glibc 2.35) keeps the packages installable on Debian 12, Ubuntu 22.04+
# and Raspberry Pi OS bookworm.
#
# This workflow only BUILDS; the release is created by hand. Same trigger
# as the Windows build, so one tag on `dev` builds both:
#
#   git tag v0.N.M && git push origin v0.N.M

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the version is the commit count

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the Qt runtime libraries and dpkg-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev \
            libgl1 libegl1 libfontconfig1 libdbus-1-3 libxkbcommon0 \
            libxkbcommon-x11-0 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libnss3 fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest
          python -c "import PySide6, pymupdf, pptx, spellchecker, pygit2; print('PySide6', PySide6.__version__)"

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Build the .deb
        run: python packaging/build_deb.py

      - name: Read the version back
        run: echo "VERSION=$(cut -d+ -f1 kherveslide/VERSION)" >> "$GITHUB_ENV"

      - name: Smoke-test the frozen app
        # VERSION, tectonic, data files, start-up, then an EMPTY tectonic
        # cache seeded by the app and two presentations compiled offline.
        run: python packaging/smoke_test.py dist/KherveSlide/KherveSlide --version "$VERSION"

      - name: Install the .deb, smoke-test the installed app, remove it
        run: |
          set -euo pipefail
          sudo apt-get install -y "./dist/KherveSlide_${VERSION}_${{ matrix.arch }}.deb"
          test -x /usr/bin/kherveslide
          test -f /usr/share/applications/kherveslide.desktop
          python packaging/smoke_test.py /opt/kherveslide/KherveSlide --version "$VERSION"
          sudo apt-get remove -y kherveslide
          test ! -e /opt/kherveslide/KherveSlide
          echo "install / run / remove OK"

      - name: Upload the .deb
        uses: actions/upload-artifact@v4
        with:
          name: KherveSlide-${{ env.VERSION }}-linux-${{ matrix.arch }}
          path: |
            dist/KherveSlide_*_${{ matrix.arch }}.deb
            dist/KherveSlide-linux-${{ matrix.arch }}.deb
          if-no-files-found: error
